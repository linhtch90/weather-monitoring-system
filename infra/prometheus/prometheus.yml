global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'ingestion-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:3000']

  - job_name: 'processing-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:3002']
