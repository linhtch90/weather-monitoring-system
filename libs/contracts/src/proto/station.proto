syntax = "proto3";

package weather.station.v1;

service StationService {
  rpc ValidateStation (ValidateStationRequest) returns (ValidateStationResponse);
  rpc GetStationConfig (GetStationConfigRequest) returns (StationConfigResponse);
  rpc UpdateReportingFrequency (UpdateReportingFrequencyRequest) returns (UpdateReportingFrequencyResponse);
}

enum StationStatus {
  STATION_STATUS_UNSPECIFIED = 0;
  STATION_STATUS_ACTIVE = 1;
  STATION_STATUS_INACTIVE = 2;
  STATION_STATUS_MAINTENANCE = 3;
  STATION_STATUS_ALERT_MODE = 4;
}

message ValidateStationRequest {
  string station_id = 1;
  string api_key = 2;
}

message ValidateStationResponse {
  bool is_valid = 1;
  StationStatus status = 2;
  int32 reporting_interval_seconds = 3;
  string error_message = 4;
}

message GetStationConfigRequest {
  string station_id = 1;
}

message StationConfigResponse {
  string station_id = 1;
  string name = 2;
  double latitude = 3;
  double longitude = 4;
  double elevation = 5;
  StationStatus status = 6;
  int32 reporting_interval_seconds = 7;
}

message UpdateReportingFrequencyRequest {
  string station_id = 1;
  int32 frequency_seconds = 2;
  string reason = 3;
}

message UpdateReportingFrequencyResponse {
  bool success = 1;
  string station_id = 2;
  int32 new_frequency_seconds = 3;
  string message = 4;
}
