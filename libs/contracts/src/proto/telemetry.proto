syntax = "proto3";

package weather.telemetry.v1;

service WeatherIngestionService {
  rpc SubmitTelemetry (TelemetryPayload) returns (IngestionAck);
  rpc StreamTelemetry (stream TelemetryPayload) returns (IngestionAck);
}

message TelemetryPayload {
  string station_id = 1;
  int64 timestamp = 2;              // Epoch milliseconds
  float temperature = 3;            // Celsius (-90 to +60)
  float humidity = 4;               // Percentage (0 to 100)
  float pressure = 5;               // hPa (800 to 1100)
  float wind_speed = 6;             // m/s
  int32 wind_direction = 7;         // Degrees (0 to 359)
  float precipitation = 8;          // mm/hr
  float battery_voltage = 9;        // Volts
  string firmware_version = 10;
  string api_key = 11;
}

message IngestionAck {
  enum StatusCode {
    STATUS_CODE_UNSPECIFIED = 0;
    SUCCESS = 1;
    REJECTED = 2;
    RATE_LIMITED = 3;
    DEGRADED = 4;
  }
  StatusCode code = 1;
  string message = 2;
  int64 server_timestamp = 3;
}
