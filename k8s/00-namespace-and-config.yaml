apiVersion: v1
kind: Namespace
metadata:
  name: weather-system
  labels:
    app.kubernetes.io/part-of: weather-monitoring-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: weather-config
  namespace: weather-system
data:
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq.weather-system.svc.cluster.local:5672"
  REDIS_URL: "redis://redis.weather-system.svc.cluster.local:6379"
  DATABASE_URL: "postgresql://postgres:postgrespassword@timescaledb.weather-system.svc.cluster.local:5432/weather_db"
  TIMESCALE_URL: "postgresql://postgres:postgrespassword@timescaledb.weather-system.svc.cluster.local:5432/weather_db"
  STATION_GRPC_URL: "station-service.weather-system.svc.cluster.local:50051"
  STATION_GRPC_PORT: "50051"
  INGESTION_HTTP_PORT: "3000"
  INGESTION_GRPC_PORT: "50052"
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secrets
  namespace: weather-system
type: Opaque
stringData:
  # Used by KEDA TriggerAuthentication in k8s/autoscaling/keda-processing-scaledobject.yaml
  host-connection-string: "amqp://guest:guest@rabbitmq.weather-system.svc.cluster.local:5672/"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: timescale-init-sql
  namespace: weather-system
data:
  init.sql: |
    -- Enable TimescaleDB Extension
    CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;

    -- 1. Relational Table: Weather Stations Metadata
    CREATE TABLE IF NOT EXISTS stations (
        id VARCHAR(64) PRIMARY KEY,
        name VARCHAR(128) NOT NULL,
        latitude DOUBLE PRECISION NOT NULL,
        longitude DOUBLE PRECISION NOT NULL,
        elevation REAL DEFAULT 0.0,
        status VARCHAR(32) NOT NULL DEFAULT 'ACTIVE',
        reporting_interval_seconds INT NOT NULL DEFAULT 60,
        api_key VARCHAR(128) NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    -- Seed Baseline Monitoring Stations
    INSERT INTO stations (id, name, latitude, longitude, elevation, status, reporting_interval_seconds, api_key)
    VALUES 
        ('ST-ALPS-001', 'Alpine High Peak Station', 45.8326, 6.8652, 3842.0, 'ACTIVE', 60, 'sec_token_alps_001'),
        ('ST-PACIFIC-002', 'Coastal Pacific Buoy', 36.7783, -122.4194, 0.0, 'ACTIVE', 60, 'sec_token_pacific_002'),
        ('ST-SAHARA-003', 'North Sahara Outpost', 25.2867, 14.4326, 450.0, 'ACTIVE', 60, 'sec_token_sahara_003')
    ON CONFLICT (id) DO NOTHING;

    -- 2. Time-Series Hypertable: Raw Weather Metrics
    CREATE TABLE IF NOT EXISTS weather_metrics (
        time TIMESTAMPTZ NOT NULL,
        station_id VARCHAR(64) NOT NULL,
        temperature REAL,
        humidity REAL,
        pressure REAL,
        wind_speed REAL,
        wind_direction SMALLINT,
        precipitation REAL,
        battery_voltage REAL
    );

    -- Composite Index for fast time-range lookups by station
    CREATE INDEX IF NOT EXISTS idx_weather_station_time ON weather_metrics (station_id, time DESC);

    -- Convert to Timescale Hypertable with 1-day chunks
    SELECT create_hypertable('weather_metrics', 'time', chunk_time_interval => INTERVAL '1 day', if_not_exists => TRUE);

    -- 3. Continuous Aggregate: Hourly Weather Summary
    CREATE MATERIALIZED VIEW IF NOT EXISTS weather_hourly_summary
    WITH (timescaledb.continuous) AS
    SELECT 
        time_bucket('1 hour', time) AS bucket,
        station_id,
        AVG(temperature) AS avg_temp,
        MIN(temperature) AS min_temp,
        MAX(temperature) AS max_temp,
        AVG(humidity) AS avg_humidity,
        AVG(pressure) AS avg_pressure,
        MIN(pressure) AS min_pressure,
        MAX(wind_speed) AS max_wind_speed,
        SUM(precipitation) AS total_rain
    FROM weather_metrics
    GROUP BY bucket, station_id
    WITH NO DATA;

    -- Refresh policy for Continuous Aggregate (hourly)
    SELECT add_continuous_aggregate_policy('weather_hourly_summary',
        start_offset => INTERVAL '3 days',
        end_offset => INTERVAL '1 hour',
        schedule_interval => INTERVAL '1 hour',
        if_not_exists => TRUE);
